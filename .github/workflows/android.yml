name: Android APK
on:
  push:
    branches: ['build/v0.6.0']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK with transient network retry
        run: |
          for attempt in 1 2 3; do
            if bash build-apk.sh; then exit 0; fi
            if ! grep -Eq '429|Too Many Requests|Read timed out|Connection reset' build-apk.log; then exit 1; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 60))
          done
          exit 1
        env:
          HHM_KEYSTORE_B64: ${{ secrets.HHM_KEYSTORE_B64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: HolidayHomeManager
          path: HolidayHomeManager_v0.6.0.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build-apk.log
