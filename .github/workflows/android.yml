name: Android APK
on:
  push:
    branches: ['build/v0.1.0']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - run: bash build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HolidayHomeManager
          path: HolidayHomeManager_v0.1.0.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build-apk.log
